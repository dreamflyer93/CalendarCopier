name: Build unsigned iPhone app

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    # Public repository: use GitHub-hosted macOS/Xcode runner.
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project CalendarCopier.xcodeproj \
            -scheme CalendarCopier \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CalendarCopier.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/CalendarCopier.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CalendarCopier-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CalendarCopier-unsigned-IPA
          path: CalendarCopier-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
