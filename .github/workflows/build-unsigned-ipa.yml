name: Build unsigned iPhone app

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# Keep the workflow token read-only. Artifact upload uses the runner's
# artifact runtime credentials, not repository write permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run privacy source audit
        run: bash scripts/privacy-audit.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project CalendarCopier.xcodeproj \
            -scheme CalendarCopier \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CalendarCopier.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/CalendarCopier.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CalendarCopier-unsigned.ipa" Payload

      - name: Upload IPA (pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CalendarCopier-unsigned-IPA
          path: CalendarCopier-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
